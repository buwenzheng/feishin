name: Publish (PR)

on:
    workflow_dispatch:
    pull_request:
        branches:
            - development
        paths:
            - 'src/**'
            - 'electron-builder*.yml'

jobs:
    publish:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [macos-26, ubuntu-latest, windows-latest]

        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install dependencies
              run: pnpm install

            - name: Cache MPV binary
              id: cache-mpv
              if: matrix.os == 'windows-latest'
              uses: actions/cache@v4
              with:
                  path: resources/mpv
                  key: mpv-shinchiro-v0.41.0

            - name: Download MPV binary (Windows)
              if: steps.cache-mpv.outputs.cache-hit != 'true' && matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  choco install mpv -y --no-progress --limit-output --force
                  $mpvDir = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mpv" -Recurse -Filter "mpv.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
                  if (-not $mpvDir) { Write-Error "mpv.exe not found"; exit 1 }
                  New-Item -ItemType Directory -Path "resources/mpv" -Force | Out-Null
                  Copy-Item "$mpvDir\*" -Destination "resources/mpv" -Recurse -Force
                  Write-Host "MPV copied to resources/mpv"

            - name: Build for Windows
              if: ${{ matrix.os == 'windows-latest' }}
              uses: nick-invision/retry@v3.0.2
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run package:win:pr

            - name: Build for Linux
              if: ${{ matrix.os == 'ubuntu-latest' }}
              uses: nick-invision/retry@v3.0.2
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run package:linux:pr

            - name: Build for MacOS
              if: ${{ matrix.os == 'macos-26' }}
              uses: nick-invision/retry@v3.0.2
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run package:mac:pr

            - name: Zip Windows Binaries
              if: ${{ matrix.os == 'windows-latest' }}
              shell: pwsh
              run: |
                  Compress-Archive -Path "dist/*.exe" -DestinationPath "dist/windows-binaries.zip" -Force

            - name: Zip Linux Binaries
              if: ${{ matrix.os == 'ubuntu-latest' }}
              run: |
                  zip -r dist/linux-binaries.zip dist/*.{AppImage,deb,rpm}

            - name: Zip MacOS Binaries
              if: ${{ matrix.os == 'macos-26' }}
              run: |
                  zip -r dist/macos-binaries.zip dist/*.dmg

            - name: Upload Windows Binaries
              if: ${{ matrix.os == 'windows-latest' }}
              uses: actions/upload-artifact@v7
              with:
                  name: windows-binaries
                  path: dist/windows-binaries.zip

            - name: Upload Linux Binaries
              if: ${{ matrix.os == 'ubuntu-latest' }}
              uses: actions/upload-artifact@v7
              with:
                  name: linux-binaries
                  path: dist/linux-binaries.zip

            - name: Upload MacOS Binaries
              if: ${{ matrix.os == 'macos-26' }}
              uses: actions/upload-artifact@v7
              with:
                  name: macos-binaries
                  path: dist/macos-binaries.zip
