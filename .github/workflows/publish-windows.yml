name: Publish Windows (Manual)

on: workflow_dispatch

jobs:
    publish:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [windows-latest]

        env:
            MPV_VERSION: '0.41.0'
            MPV_ARCH: 'x86_64'

        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install dependencies
              run: pnpm install

            - name: Cache MPV binary
              id: cache-mpv
              uses: actions/cache@v4
              with:
                  path: resources/mpv
                  key: mpv-shinchiro-${{ env.MPV_VERSION }}-${{ env.MPV_ARCH }}

            - name: Download MPV binary (Windows)
              if: steps.cache-mpv.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'

                  choco install 7zip -y --no-progress --limit-output

                  $mpvFileName = "mpv-$env:MPV_VERSION-$env:MPV_ARCH.7z"
                  # Direct file mirror — the /download page often returns HTML on headless runners (invalid 7z).
                  $mpvUrl = "https://downloads.sourceforge.net/project/mpv-player-windows/release/$mpvFileName"

                  New-Item -ItemType Directory -Path "resources/mpv" -Force | Out-Null
                  New-Item -ItemType Directory -Path ".cache/mpv" -Force | Out-Null

                  $archivePath = ".cache/mpv/$mpvFileName"
                  Write-Host "Downloading MPV: $mpvUrl -> $archivePath"
                  curl.exe -fsSL -o $archivePath $mpvUrl

                  $len = (Get-Item $archivePath).Length
                  if ($len -lt 5MB) {
                      Write-Host "First bytes (expect 7z signature 37 7A BC AF):"
                      Format-Hex -Path $archivePath -Count 16
                      throw "Downloaded file is too small ($len bytes); not a valid MPV archive."
                  }

                  Write-Host "Extracting MPV to resources/mpv"
                  & 7z x $archivePath "-oresources/mpv" -y | Out-Null

                  if (!(Test-Path "resources/mpv/mpv.exe")) { throw "resources/mpv/mpv.exe not found after extraction" }
                  Write-Host "MPV ready: resources/mpv/mpv.exe"

            - name: Assert MPV exists
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  if (!(Test-Path "resources/mpv/mpv.exe")) { throw "resources/mpv/mpv.exe missing" }

            - name: Build and Publish releases
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@v3.0.2
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:win
                  on_retry_command: pnpm cache delete
